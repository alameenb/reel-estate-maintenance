name: pr-checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit names its story
        run: python3 .github/scripts/trace_check.py "origin/${{ github.base_ref }}" HEAD
  lwc-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run test:unit
